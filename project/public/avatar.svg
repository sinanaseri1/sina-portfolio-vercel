<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Abstract geometric avatar">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5cf6"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><circle cx="120" cy="120" r="120"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="240" height="240" fill="url(#field)"/>
    <rect width="240" height="240" fill="url(#sheen)"/>

    <!-- concentric orbit rings -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5">
      <circle cx="120" cy="120" r="94"/>
      <circle cx="120" cy="120" r="70"/>
      <circle cx="120" cy="120" r="46"/>
    </g>

    <!-- crossing arcs -->
    <path d="M28 150 A 104 104 0 0 1 212 150" fill="none"
          stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
    <path d="M46 74 A 104 104 0 0 0 194 74" fill="none"
          stroke="#0b0b14" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>

    <!-- nucleus -->
    <circle cx="120" cy="120" r="22" fill="#ffffff" fill-opacity="0.92"/>
    <circle cx="120" cy="120" r="9" fill="#5b4bd6"/>

    <!-- orbiting nodes -->
    <circle cx="120" cy="26" r="7" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="190" cy="170" r="5" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="50" cy="170" r="5" fill="#0b0b14" fill-opacity="0.3"/>
  </g>
</svg>
